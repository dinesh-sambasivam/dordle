name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare workspace for CI
        run: |
          node -e "
          const fs = require('fs');

          // Strip Replit-specific settings from pnpm-workspace.yaml
          // Standard pnpm does not support the '-' override syntax or minimumReleaseAge
          let yaml = fs.readFileSync('pnpm-workspace.yaml', 'utf8');
          // Keep only the 'packages:' and 'catalog:' sections
          const packagesMatch = yaml.match(/^packages:[\s\S]*?(?=^\w)/m);
          const catalogMatch = yaml.match(/^catalog:[\s\S]*/m);
          const clean = (packagesMatch ? packagesMatch[0] : '') + (catalogMatch ? catalogMatch[0] : '');
          fs.writeFileSync('pnpm-workspace.yaml', clean);
          console.log('Cleaned pnpm-workspace.yaml');

          // Delete the lockfile so pnpm resolves fresh without the baked-in '-' overrides
          fs.rmSync('pnpm-lock.yaml', { force: true });
          console.log('Removed pnpm-lock.yaml for clean resolve');
          "

      - run: pnpm install

      - name: Build Dordle
        run: pnpm --filter @workspace/dordle run build
        env:
          BASE_PATH: /
          PORT: 3000
          NODE_ENV: production

      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/dordle/dist/public

  publish:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
